<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<script>
			// Resolve the theme before first paint so there is no flash of the wrong one: a saved
			// choice wins, otherwise the OS setting. The key must match THEME_KEY in theme.svelte.ts.
			(function () {
				try {
					var t = localStorage.getItem('site:theme');
					if (t !== 'light' && t !== 'dark')
						t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					document.documentElement.dataset.theme = t;
				} catch (e) {}
			})();
		</script>
		<meta name="theme-color" content="#f8f9fb" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="/site.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
